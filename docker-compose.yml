version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: reservation_db
    ports:
      - "3306:3306"
    command:
      - --innodb-lock-wait-timeout=20
      - --max-connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p password"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/reservation_db?rewriteBatchedStatements=true&cachePrepStmts=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: password
      JWT_SECRET: "your-very-secure-and-long-secret-key-for-jwt-signing-12345"
      ADMIN_SECRET: "admin-super-secret-key"
    depends_on:
      mysql:
        condition: service_healthy
