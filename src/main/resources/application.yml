server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 1000
    max-connections: 10000

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/reservation_db?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    health:
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId}]"
  level:
    root: INFO
    com.paytm.money.reservation: DEBUG
